  <script>
  let global_token;

    async function login() {

      const dadinhos = { 
      "email": "tobizin@gmail.com",
      "password": "123"
    }

      const requisicao = await fetch('http://localhost:3001/auth/login',
        {
          method: 'POST',
          headers: {
            'Content-Type': `application/json`//indica o que deve ser enviado
          },
          body: JSON.stringify(dadinhos)
        }
      )
    
      if(!requisicao.ok){
        return console.log("o token nao pode ser enviado resolve ai porra (┬┬﹏┬┬)")
      }
      const resposta = await requisicao.json();
      global_token = resposta.accessToken;
      console.log(global_token)
    };
   
  
 

    async function carregarItemns() {
      

      const requisicao = await fetch('http://localhost:3001/items/',
        {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${global_token}`,
            'Content-Type': `application/json`//indica o que deve ser enviado
          }
        }
      );

      if (!requisicao.ok) {
        return console.log("deu ruim ai aruma seu merda")
      }
      let dados = await requisicao.json();
      //console.log(JSON.stringify(dados));

      const divItens = document.getElementById("items")

      divItens.innerHTML = dados.map(item => `
  <h1>titulo:${item.title}<h1>
    <h2>foto:<a href='${item.url}'> ${item.url} </a><h2>
        <h3>tags:${item.tags}<h3>
        <h3>notas:${item.notes}<h3>`)
    }
